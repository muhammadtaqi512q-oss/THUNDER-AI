<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebCloud Frame Viewer</title>
    <style>
        :root {
            --accent-pink: #ff4d8d;
            --bg-gradient: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Glassmorphism Header */
        .header {
            width: 90%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 15px 30px;
            border-radius: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        .header h1 {
            color: #4a4a4a;
            font-size: 1.5rem;
            font-weight: 800;
        }

        .btn-back {
            text-decoration: none;
            color: white;
            background: var(--accent-pink);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-back:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 77, 141, 0.4);
        }

        /* The Website Frame */
        .frame-container {
            width: 90%;
            max-width: 1200px;
            height: 75vh;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            border: 8px solid rgba(255, 255, 255, 0.5);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            .header h1 { font-size: 1.1rem; }
            .frame-container { height: 80vh; width: 95%; }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>WebCloud Preview</h1>
        <a href="#" class="btn-back">Live Builder</a>
    </header>

    <main class="frame-container">
        <iframe src="https://019cfc82-01cb-7431-a270-adc1cd8ac9b1.arena.site/" title="WebCloud Builder"></iframe>
    </main>

</body>
</html>
